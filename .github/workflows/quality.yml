name: Quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate demand-management document
        run: python scripts/check_docx.py docs/gestao-demandas-grupo-5.docx
      - name: Require demand log update in every pull request
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- docs/gestao-demandas-grupo-5.docx; then
            echo "ERROR: PRs direcionadas a main exigem atualizacao de docs/gestao-demandas-grupo-5.docx com um registro diario de demanda e evidencia. PRs para develop nao exigem esta atualizacao."
            exit 1
          fi
      - name: Run tests
        run: pytest
