name: Quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate frozen datasets and independent areas
        run: python scripts/validate_project.py
      - name: Smoke-test all five independent pipelines
        run: |
          for area in grupo1 grupo2 grupo3 grupo4 grupo5; do
            python "analyses/$area/pipeline.py"
          done
      - name: Run tests
        run: pytest
